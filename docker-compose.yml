services:
  api:
    image: mayberry4477/local_monitoring:latest
    environment:
      API_LISTEN_ADDRESS: 0.0.0.0
      API_PORT: "8000"
      LOG_LEVEL: INFO
      HTTP_TIMEOUT_SECONDS: "10"
      TZ: America/New_York

      # 1) Uptime Kuma status page -> up/down counter
      UPTIME_KUMA_BASE_URL: http://uptime-kuma:3001
      UPTIME_KUMA_SLUG: my-status-page

      # 2) WebDAV single-file freshness check
      WEBDAV_URL: http://webdav.local/path/to/file.txt
      WEBDAV_USERNAME: ""
      WEBDAV_PASSWORD: ""
      WEBDAV_RECENT_HOURS: "24"

      # 3) docker-updater pending-updates count
      DOCKER_UPDATER_BASE_URL: http://docker-updater:9090

      # 4) Docker running/stopped container count
      DOCKER_HOST: unix:///var/run/docker.sock

      # 5) Per-site container list -> Uptime Kuma v2 docker-monitor coverage
      # (comma-separate multiple blob URLs to merge them)
      CONTAINER_BLOB: https://raw.githubusercontent.com/mayberryjp/localdomains/refs/heads/main/azure.mayberry.farm
      UPTIME_KUMA_V2_API_BASE_URL: http://uptimekuma-v2-api.azure.mayberry.farm:12000
      UPTIME_KUMA_V2_API_KEY: ""

      # 6) Per-site device list -> Uptime Kuma v2 ping-monitor coverage. Lines are
      # "ip_address,domain_name,interval" (same shape as CONTAINER_BLOB); a device is
      # the first DNS label of the 2nd field. netgearswitch.office.mayberry.farm is
      # covered by a ping monitor named like "OFFICE PING NETGEARSWITCH".
      SANDO_DEVICES_URL: ""

      # 7) Uptime Kuma monitors deliberately not tied to a container or device.
      # Comma-separated monitor names (or last-word tokens) to treat as expected so
      # they drop out of the "additional monitors" list.
      ALLOWED_ADDITIONAL_MONITORS: ""

      # Browser-reachable URLs for the dashboard's section-title links. These are
      # the public web UIs a remote client opens, not the internal base URLs above.
      # Leave blank to render the title as plain text instead of a link.
      UPTIME_KUMA_PUBLIC_URL: ""
      PORTAINER_URL: ""
      DOCKER_UPDATER_PUBLIC_URL: ""
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # The Docker check reads the socket; the "delete unused images" dashboard
    # action also writes to it (image prune), so it is mounted read-write. The
    # image runs as a non-root user, so add the host's docker group GID here to
    # grant access to the socket:
    # group_add:
    #   - "999"
